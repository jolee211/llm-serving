# Static EFS PV for the Hugging Face model cache.
# volumeHandle is the EFS filesystem id and is recreated with every cluster rebuild.
# Set it from: aws efs create-file-system ... --query FileSystemId --output text
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hf-cache
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi: {driver: efs.csi.aws.com, volumeHandle: fs-0e3d8ae589fde5a92}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc
  resources: {requests: {storage: 20Gi}}
